name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/01a0ed87-blazon-please"
    tags:
      - "exe-*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer and portable EXE
        run: npm run desktop:build

      - name: Normalize installer name
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $installer.FullName "src-tauri/target/release/bundle/nsis/Blazon-Please-$version-setup.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Blazon-Please-Windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/blazon-please.exe
            src-tauri/target/release/bundle/nsis/Blazon-Please-*-setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/exe-') || github.ref == 'refs/heads/arena/01a0ed87-blazon-please'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="exe-${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/exe-* ]]; then TAG="$GITHUB_REF_NAME"; fi
          node scripts/release-notes.mjs > notes.md
          cat notes.md
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Гербы, пожалуйста! v${VERSION}" \
            --notes-file notes.md \
            "src-tauri/target/release/blazon-please.exe" \
            src-tauri/target/release/bundle/nsis/Blazon-Please-*-setup.exe
