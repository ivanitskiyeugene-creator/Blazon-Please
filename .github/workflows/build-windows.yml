name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "exe-*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build installer and portable EXE
        run: npm run desktop:build

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Blazon-Please-Windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/blazon-please.exe
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/exe-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Гербы, пожалуйста! v${VERSION}" \
            --notes-file notes.md \
            "src-tauri/target/release/blazon-please.exe" \
            src-tauri/target/release/bundle/nsis/*.exe
