name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "exe-*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer and portable EXE
        run: npm run desktop:build

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Blazon-Please-Windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/release/blazon-please.exe
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/exe-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat > notes.js <<'EOF'
          const fs = require('fs');
          const src = fs.readFileSync('src/game/changelog.ts', 'utf8');
          const head = src.slice(src.indexOf('export const CHANGELOG'));
          const m = head.match(/version:\s*"([^"]+)"[\s\S]*?tag:\s*"([^"]+)"[\s\S]*?items:\s*\[([\s\S]*?)\]/);
          if (!m) throw new Error('не удалось разобрать changelog');
          const items = [...m[3].matchAll(/"([^"]+)"/g)].map((x) => `- ${x[1]}`).join('\n');
          console.log(
            `**Версия ${m[1]} — ${m[2]}**\n\n` +
            `${items}\n\n` +
            `Скачать:\n- \`blazon-please.exe\` — портативная версия, без установки\n- \`*-setup.exe\` — установщик Windows\n\n` +
            `Полный список изменений — на экране «Сводка» в игре. Сборка выполнена автоматически через GitHub Actions.`
          );
          EOF
          node notes.js > notes.md
          assets=("src-tauri/target/release/blazon-please.exe")
          for f in src-tauri/target/release/bundle/nsis/*.exe; do assets+=("$f"); done
          gh release create "$GITHUB_REF_NAME" \
            --title "Гербы, пожалуйста! v${VERSION}" \
            --notes-file notes.md \
            "${assets[@]}"
