name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "apk-*"

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Android SDK, NDK & Environment
        run: |
          SDK_PATH="/usr/local/lib/android/sdk"
          if [ ! -d "$SDK_PATH" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
            SDK_PATH="$ANDROID_SDK_ROOT"
          fi
          if [ ! -d "$SDK_PATH" ] && [ -n "$ANDROID_HOME" ]; then
            SDK_PATH="$ANDROID_HOME"
          fi

          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> $GITHUB_ENV

          # Accept licenses and install platform tools
          yes | $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" 2>/dev/null || true

          NDK_PATH=$(find $SDK_PATH/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          echo "Found NDK at: $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

          # Create unversioned symlinks for NDK toolchain binaries so standard cargo linkers work
          LLVM_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ln -sf "$LLVM_BIN/aarch64-linux-android34-clang" "$LLVM_BIN/aarch64-linux-android-clang" || true
          ln -sf "$LLVM_BIN/aarch64-linux-android34-clang" "$LLVM_BIN/aarch64-linux-android-gcc" || true
          ln -sf "$LLVM_BIN/aarch64-linux-android34-clang++" "$LLVM_BIN/aarch64-linux-android-clang++" || true
          ln -sf "$LLVM_BIN/aarch64-linux-android34-clang++" "$LLVM_BIN/aarch64-linux-android-g++" || true

          echo "$LLVM_BIN" >> $GITHUB_PATH
          echo "$SDK_PATH/platform-tools" >> $GITHUB_PATH
          echo "$SDK_PATH/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_PATH/build-tools/34.0.0" >> $GITHUB_PATH

          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$LLVM_BIN/aarch64-linux-android34-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android34-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android34-clang++" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$LLVM_BIN/llvm-ar" >> $GITHUB_ENV

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk || true

      - name: Install frontend dependencies
        run: |
          npm ci || npm install
          npm run build

      - name: Initialize Android project
        run: |
          npx @tauri-apps/cli android init --ci
          chmod +x src-tauri/gen/android/gradlew

          # Write local.properties for Gradle
          printf "sdk.dir=%s\nndk.dir=%s\n" "$ANDROID_HOME" "$NDK_HOME" > src-tauri/gen/android/local.properties
          printf "sdk.dir=%s\nndk.dir=%s\n" "$ANDROID_HOME" "$NDK_HOME" > src-tauri/gen/android/app/local.properties

      - name: Setup Keystore for Android Signing
        run: |
          KEYSTORE_PATH="/tmp/upload.jks"
          keytool -genkey -v -keystore "$KEYSTORE_PATH" \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass blazonplease -keypass blazonplease \
            -dname "CN=BlazonPlease,OU=Game,O=Blazon,L=Minsk,S=Minsk,C=BY"

          cp "$KEYSTORE_PATH" src-tauri/gen/android/upload.jks
          cp "$KEYSTORE_PATH" src-tauri/gen/android/app/upload.jks

      - name: Configure Android Manifest and Gradle
        run: |
          node -e '
          const fs = require("fs");
          const p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml";
          if (fs.existsSync(p)) {
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("android:screenOrientation")) {
              xml = xml.replace("<activity", "<activity android:screenOrientation=\"sensorLandscape\"");
            }
            fs.writeFileSync(p, xml);
            console.log("Updated AndroidManifest.xml for sensorLandscape");
          }
          const ktsPath = "src-tauri/gen/android/app/build.gradle.kts";
          if (fs.existsSync(ktsPath)) {
            let kts = fs.readFileSync(ktsPath, "utf8");
            kts = kts.replace(/compileSdk\s*=\s*\d+/g, "compileSdk = 34");
            kts = kts.replace(/targetSdk\s*=\s*\d+/g, "targetSdk = 34");
            kts = kts.replace(/isMinifyEnabled\s*=\s*true/g, "isMinifyEnabled = false");
            kts = kts.replace(/signingConfig\s*=\s*signingConfigs\.getByName\("release"\)/g, "signingConfig = signingConfigs.getByName(\"debug\")");
            fs.writeFileSync(ktsPath, kts);
            console.log("Configured build.gradle.kts");
          }
          '

      - name: Build Android APK
        run: |
          echo "Building Android APK..."
          npx @tauri-apps/cli android build --apk --target aarch64 --ci

      - name: Prepare APK deliverables
        id: apks
        run: |
          mkdir -p deliverables
          
          VERSION=$(node -p "require('./package.json').mobileVersion || require('./package.json').version")
          echo "MOBILE_VERSION=$VERSION" >> $GITHUB_ENV

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)

          for apk in $(find src-tauri/gen/android -name "*.apk"); do
            echo "Processing APK: $apk"
            DEST="deliverables/Blazon-Please-${VERSION}.apk"
            DEST_ARCH="deliverables/Blazon-Please-${VERSION}-arm64.apk"
            
            if [ -n "$APKSIGNER" ]; then
              $APKSIGNER sign --ks /tmp/upload.jks --ks-pass pass:blazonplease --ks-key-alias upload --key-pass pass:blazonplease --out "$DEST" "$apk" 2>/dev/null || cp "$apk" "$DEST"
            else
              jarsigner -keystore /tmp/upload.jks -storepass blazonplease -keypass blazonplease "$apk" upload 2>/dev/null || true
              cp "$apk" "$DEST"
            fi
            cp "$DEST" "$DEST_ARCH"
          done

          ls -la deliverables/

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blazon-Please-Android-APK
          if-no-files-found: error
          retention-days: 30
          path: deliverables/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/apk-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ env.MOBILE_VERSION }}
          node scripts/release-notes-apk.mjs > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Гербы, пожалуйста! (Android APK) v${VERSION}" \
            --notes-file notes.md \
            deliverables/*.apk
