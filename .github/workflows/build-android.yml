name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "apk-*"

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Android NDK & Environment
        run: |
          SDK_PATH="/usr/local/lib/android/sdk"
          if [ ! -d "$SDK_PATH" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
            SDK_PATH="$ANDROID_SDK_ROOT"
          fi
          if [ ! -d "$SDK_PATH" ] && [ -n "$ANDROID_HOME" ]; then
            SDK_PATH="$ANDROID_HOME"
          fi

          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> $GITHUB_ENV

          NDK_PATH=$(find $SDK_PATH/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            echo "Installing NDK via sdkmanager..."
            $SDK_PATH/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
            NDK_PATH="$SDK_PATH/ndk/26.3.11579264"
          fi
          echo "Found NDK at: $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

          # Add NDK toolchains and Android build tools to PATH
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "$SDK_PATH/platform-tools" >> $GITHUB_PATH
          echo "$SDK_PATH/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install frontend dependencies
        run: |
          npm ci
          npm run build

      - name: Initialize Android project
        run: |
          npx @tauri-apps/cli android init --ci
          chmod +x src-tauri/gen/android/gradlew

          # Write local.properties for Gradle
          printf "sdk.dir=%s\nndk.dir=%s\n" "$ANDROID_HOME" "$NDK_HOME" > src-tauri/gen/android/local.properties
          printf "sdk.dir=%s\nndk.dir=%s\n" "$ANDROID_HOME" "$NDK_HOME" > src-tauri/gen/android/app/local.properties

      - name: Setup Keystore for Android Signing
        run: |
          KEYSTORE_PATH="/tmp/upload.jks"
          keytool -genkey -v -keystore "$KEYSTORE_PATH" \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass blazonplease -keypass blazonplease \
            -dname "CN=BlazonPlease,OU=Game,O=Blazon,L=Minsk,S=Minsk,C=BY"

          cp "$KEYSTORE_PATH" src-tauri/gen/android/upload.jks
          cp "$KEYSTORE_PATH" src-tauri/gen/android/app/upload.jks

          printf "storePassword=blazonplease\nkeyPassword=blazonplease\nkeyAlias=upload\nstoreFile=/tmp/upload.jks\n" > src-tauri/gen/android/keystore.properties
          printf "storePassword=blazonplease\nkeyPassword=blazonplease\nkeyAlias=upload\nstoreFile=/tmp/upload.jks\n" > src-tauri/gen/android/app/keystore.properties

      - name: Configure Android Manifest
        run: |
          node -e '
          const fs = require("fs");
          const p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml";
          if (fs.existsSync(p)) {
            let xml = fs.readFileSync(p, "utf8");
            if (!xml.includes("android:screenOrientation")) {
              xml = xml.replace("<activity", "<activity android:screenOrientation=\"sensorLandscape\"");
            }
            fs.writeFileSync(p, xml);
            console.log("Updated AndroidManifest.xml for sensorLandscape");
          }
          '

      - name: Build Android APK
        run: |
          echo "Building Android APK..."
          set -o pipefail
          npx @tauri-apps/cli android build --apk --target aarch64 --ci 2>&1 | tee /tmp/tauri-build.log || {
            echo "=== TAURI ANDROID BUILD LOG TAIL ==="
            tail -n 100 /tmp/tauri-build.log
            echo "=== TRYING GRADLE ASSEMBLE RELEASE ==="
            (cd src-tauri/gen/android && ./gradlew assembleRelease --stacktrace --info 2>&1 | tee /tmp/gradle-release.log) || {
              tail -n 100 /tmp/gradle-release.log
              echo "=== TRYING GRADLE ASSEMBLE DEBUG ==="
              (cd src-tauri/gen/android && ./gradlew assembleDebug --stacktrace --info 2>&1 | tee /tmp/gradle-debug.log) || {
                tail -n 100 /tmp/gradle-debug.log
                exit 1
              }
            }
          }

      - name: Prepare APK deliverables
        id: apks
        run: |
          mkdir -p deliverables
          
          VERSION=$(node -p "require('./package.json').mobileVersion || '0.1.0'")
          echo "MOBILE_VERSION=$VERSION" >> $GITHUB_ENV

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)

          for apk in $(find src-tauri/gen/android -name "*.apk"); do
            echo "Found APK: $apk"
            BASENAME=$(basename "$apk")

            # Sign unsigned APKs if any
            if [[ "$BASENAME" == *"unsigned"* ]]; then
              SIGNED_PATH="${apk%-unsigned.apk}.apk"
              if [ -n "$APKSIGNER" ]; then
                $APKSIGNER sign --ks /tmp/upload.jks --ks-pass pass:blazonplease --ks-key-alias upload --key-pass pass:blazonplease --out "$SIGNED_PATH" "$apk" 2>/dev/null || jarsigner -keystore /tmp/upload.jks -storepass blazonplease -keypass blazonplease "$apk" upload 2>/dev/null
              else
                jarsigner -keystore /tmp/upload.jks -storepass blazonplease -keypass blazonplease "$apk" upload 2>/dev/null || true
                SIGNED_PATH="$apk"
              fi
              cp "$SIGNED_PATH" "deliverables/Blazon-Please-${VERSION}.apk"
              cp "$SIGNED_PATH" "deliverables/Blazon-Please-${VERSION}-arm64.apk"
            else
              cp "$apk" "deliverables/Blazon-Please-${VERSION}.apk"
              cp "$apk" "deliverables/Blazon-Please-${VERSION}-arm64.apk"
            fi
          done

          ls -la deliverables/

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blazon-Please-Android-APK
          if-no-files-found: error
          retention-days: 30
          path: deliverables/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/apk-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ env.MOBILE_VERSION }}
          node scripts/release-notes-apk.mjs > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Гербы, пожалуйста! (Android APK) v${VERSION}" \
            --notes-file notes.md \
            deliverables/*.apk
