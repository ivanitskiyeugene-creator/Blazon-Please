[package]
name = "blazon-please"
version = "0.9.0"
description = "Гербы, пожалуйста! — игра об инспекторе КПП-7"
authors = ["Blazon Please"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "blazon_please"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
